[project]
name = "qas-prep"
version = "0.1.0"
description = "ACCUPLACER QAS adaptive practice tests with a Claude tutor, served on the home network"
readme = "README.md"
authors = [
    { name = "Thomas Mathew", email = "5634727+thomas-matthew@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.179",
    "fastapi>=0.162.4",
    "resvg-py>=0.5.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
qas-prep = "qas_prep.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
